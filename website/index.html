<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="EmoBox —— Windows 优先的本地表情包管理器：导入整理、秒速搜索、一键复制到任何聊天窗口。"
    />
    <title>EmoBox —— Windows 本地表情包管理器</title>
    <script>
      // 防闪烁：React 挂载前同步主题（与 useSiteTheme 读同一个 localStorage key）。
      (function () {
        try {
          var pref = localStorage.getItem("emobox-site.theme");
          var dark =
            pref === "dark" ||
            ((pref === null || pref === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#191d26" : "#fafafa");
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
