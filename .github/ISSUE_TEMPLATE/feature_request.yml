name: 功能建议
description: 提议新功能或改进现有行为
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 EmoBox 怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      description: 其他工具是怎么做的？链接、截图都可以
    validations:
      required: false
